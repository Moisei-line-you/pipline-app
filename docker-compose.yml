services:
  postgres:
    image: postgres:16
    container_name: pipeline-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # server:  # включим позже, когда появится server/Dockerfile
  #   ...

volumes:
  pgdata: